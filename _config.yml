# Site settings
title: Wenzhuo Xu
subtitle: Ph.D. Candidate, Carnegie Mellon University
email: wzxu@cmu.edu
description: >-
  Wenzhuo Xu is a Ph.D. candidate at Carnegie Mellon University and a Research
  Scientist Intern at Adobe Research, working on agentic and vision-language
  systems for physical reasoning, and on machine learning for large-scale
  physical simulation.
baseurl: ""
url: "https://wenzhuoxu.com"
# jekyll-github-metadata (pulled in by the github-pages gem) needs the repo name
# to build with JEKYLL_ENV=production. CI gets it from the Actions environment;
# stating it here means a local production build works too.
repository: "WenzhuoXu/wenzhuoxu.github.io"

# Social profiles
github_username: WenzhuoXu

# Theme settings
# Using remote theme instead of gem-based theme for better GitHub Pages compatibility
remote_theme: mmistakes/minimal-mistakes@4.24.0
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site structure
permalink: /:categories/:title/

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true          # required — the theme's TOC is generated against heading anchors
  entity_output: as_char
  toc_levels: 2..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-include-cache

# Minimal Mistakes specific settings
include:
  - _pages

# Author information
author:
  name   : "Wenzhuo Xu"
  avatar : "/assets/images/self_image.jpg"
  bio    : "Ph.D. candidate at Carnegie Mellon University. Research Scientist Intern at Adobe Research."
  location: "Pittsburgh, PA"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:wzxu@cmu.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/WenzhuoXu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/wenzhuo-xu-174592110/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=3RqGjxwAAAAJ&hl=en&oi=ao"

# Page defaults. `path: ""` covers index.markdown at the repo root as well as
# everything under _pages, so root pages no longer inherit nothing. Blog chrome
# (read time, share buttons, related posts) is off site-wide — there is no blog.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      share: false
      related: false

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/WenzhuoXu"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/wenzhuo-xu-174592110/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=3RqGjxwAAAAJ&hl=en&oi=ao"
