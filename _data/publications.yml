# Single source of truth for every publication, talk-linked paper and technical
# report on the site. Rendered by _includes/pub-list.html.
#
# Fields:
#   id        anchor target, e.g. /publications/#teecnet
#   type      journal | conference | report | project
#   title     plain text
#   url       optional; wraps the title in a link
#   authors   HTML (use <strong> for Wenzhuo)
#   venue     HTML
#   status    optional short tag rendered as a pill, e.g. "in preparation"
#   takeaway  one plain-language sentence; what a non-specialist should take away
#   featured  when true, the entry also appears in the homepage bibliography
#             (Recent publications). Papers only — PROJECTS live in
#             _data/projects.yml and are a separate component; do not
#             duplicate a project card here.
#   rank      ordering in that list (ascending, newest first)
#   links     list of {label, url}
#
# To add a paper: add an entry here in the right reverse-chronological slot.
# Nothing else needs editing.

# ---------------------------------------------------------------- journal ---
- id: flow-conveyance
  type: journal
  title: "Scalable super-resolution of flow conveyance systems through adaptive domain decomposition"
  # Venue per Crossref (DOI 10.1115/1.4071858). NOTE: main_1.tex records this as
  # JMSE — that is a CV error; the published record is JCISE. Fix the CV too.
  authors: "<strong>Wenzhuo Xu</strong>, Akibi Archer, Mike McCarrell, Scott Hesser, Noelia Grande Gutiérrez, Christopher McComb"
  venue: "<em>Journal of Computing and Information Science in Engineering</em> 26 (2026)"
  url: "https://doi.org/10.1115/1.4071858"
  takeaway: "Splits a large conveyance geometry into adaptively sized subdomains so a learned super-resolution model runs on full industrial ducts rather than toy meshes."
  featured: true
  rank: 2
  links:
    - label: "DOI"
      url: "https://doi.org/10.1115/1.4071858"

- id: energy-based-features
  type: journal
  title: "Energy-based feature extraction with adaptive local domain decomposition for prediction of transient and turbulence flow with operator regression models"
  authors: "<strong>Wenzhuo Xu</strong>, Madhav Karthikeyakannan, Christopher McComb, Noelia Grande Gutiérrez"
  venue: "<em>Computers &amp; Fluids</em> 307, 106958 (2026)"
  url: "https://doi.org/10.1016/j.compfluid.2025.106958"
  takeaway: "Learns which energy content actually matters in a transient or turbulent flow, so an operator-regression surrogate stays accurate where fixed-resolution surrogates drift."
  featured: true
  rank: 3
  links:
    - label: "DOI"
      url: "https://doi.org/10.1016/j.compfluid.2025.106958"

- id: locality
  type: journal
  title: "Enforcing the principle of locality for physical simulations with neural operators"
  authors: "Jiangce Chen, <strong>Wenzhuo Xu</strong>, Zeda Xu, Noelia Grande Gutiérrez, Sneha Prabha Narra, Christopher McComb"
  venue: "<em>Journal of Computational Physics</em> 538, 114131 (2025)"
  url: "https://doi.org/10.1016/j.jcp.2025.114131"
  takeaway: "Shows that restricting a neural operator to a bounded physical neighbourhood is what lets it generalize to meshes far larger than anything it was trained on."
  featured: true
  rank: 4
  links:
    - label: "DOI"
      url: "https://doi.org/10.1016/j.jcp.2025.114131"

- id: teecnet
  type: journal
  title: "Taylor series error correction network for super-resolution of discretized partial differential equation solutions"
  authors: "<strong>Wenzhuo Xu</strong>, Christopher McComb, Noelia Grande Gutiérrez"
  venue: "<em>Journal of Computational Physics</em> 521, 113569 (2025)"
  url: "https://doi.org/10.1016/j.jcp.2024.113569"
  takeaway: "Learns the discretization error between a coarse and a fine solver, so a coarse mesh recovers fine-mesh accuracy at a fraction of the cost."
  featured: true
  rank: 5
  links:
    - label: "DOI"
      url: "https://doi.org/10.1016/j.jcp.2024.113569"

- id: fno-am-journal
  type: journal
  title: "Capturing local temperature evolution during additive manufacturing through Fourier neural operators"
  authors: "Jiangce Chen, <strong>Wenzhuo Xu</strong>, Martha Baldwin, Björn Nijhuis, Ton van den Boogaard, Noelia Grande Gutiérrez, Sneha Prabha Narra, Christopher McComb"
  venue: "<em>Journal of Manufacturing Science and Engineering</em> 146(9) (2024)"
  url: "https://asmedigitalcollection.asme.org/manufacturingscience/article/146/9/091001/1199320"
